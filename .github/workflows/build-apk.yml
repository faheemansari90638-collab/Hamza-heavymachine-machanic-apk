name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if ! command -v java >/dev/null 2>&1; then
            echo "ERROR: Java executable could not be detected."
            exit 1
          fi
          java -version 2>&1
          VERSION_LINE="$(java -version 2>&1 | head -n 1 || true)"
          RAW_VERSION="$(echo "$VERSION_LINE" | sed -nE 's/.*"([0-9]+(\.[0-9]+)*).*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "ERROR: Unable to detect active Java version from: $VERSION_LINE"
            exit 1
          fi
          MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d. -f1)"
          if [ "$MAJOR_VERSION" = "1" ]; then
            MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d. -f2)"
          fi
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid Java major version detected: $MAJOR_VERSION"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but Java $MAJOR_VERSION was detected."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME:+${JAVA_HOME}/bin/keytool}"
          if [ -z "$KEYTOOL_BIN" ] || [ ! -x "$KEYTOOL_BIN" ]; then
            KEYTOOL_BIN="$(command -v keytool || true)"
          fi
          if [ -z "$KEYTOOL_BIN" ]; then
            echo "ERROR: keytool from the configured Java installation was not found."
            exit 1
          fi

          if [ ! -f ./debug.keystore ]; then
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "Existing ./debug.keystore found; skipping generation."
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "ERROR: Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "ERROR: $APK_PATH does not have a .apk extension."
            exit 1
          fi
          echo "Verified debug APK: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "ERROR: Verified debug APK is missing or empty."
            exit 1
          fi
          TEMP_ASSET_DIR="$(mktemp -d)"
          PREPARED_APK="${TEMP_ASSET_DIR}/app-debug.apk"
          cp "$SOURCE_APK" "$PREPARED_APK"
          if [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "ERROR: Failed to copy APK into temporary release asset directory."
            exit 1
          fi
          echo "apk_path=${PREPARED_APK}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset with filename app-debug.apk."

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          PREPARED_APK="${{ steps.prepare_asset.outputs.apk_path }}"
          if [ -z "$PREPARED_APK" ] || [ ! -f "$PREPARED_APK" ]; then
            echo "ERROR: Prepared APK release asset does not exist."
            exit 1
          fi
          if [ ! -s "$PREPARED_APK" ]; then
            echo "ERROR: Prepared APK release asset is empty."
            exit 1
          fi
          if [[ "$PREPARED_APK" != *.apk ]]; then
            echo "ERROR: Prepared release asset must end in .apk."
            exit 1
          fi
          if [ "$(basename "$PREPARED_APK")" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Purpose: Intended for testing only (not a Play Store production release)
          - Signing: Signed only with a temporary debug keystore
          EOF
          )

          gh release create "$RELEASE_TAG" \
            "$PREPARED_APK" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$RELEASE_TAG" --json tagName,name,url \
              --template 'Release Tag: {{.tagName}}{{"\n"}}Release Title: {{.name}}{{"\n"}}Release URL: {{.url}}{{"\n"}}'
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"
            echo "Backup Actions Artifact: app-debug-apk"

            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_URL}"
              echo ""
              echo "- **Release Tag:** ${RELEASE_TAG}"
              echo "- **APK Filename:** app-debug.apk"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Publishing to GitHub Releases failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ] && [ -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded (app/build/outputs/apk/debug/app-debug.apk)."
            else
              echo "The debug APK build did not produce a verified APK."
            fi
            if [ "${{ steps.publish_release.outcome }}" = "failure" ]; then
              echo "The GitHub Actions artifact named app-debug-apk remains available as a backup."
            fi

            {
              echo "### GitHub Release Warning"
              echo ""
              echo "Publishing to GitHub Releases did not complete successfully; do not rely on the latest-release link for this run."
              if [ -f "app/build/outputs/apk/debug/app-debug.apk" ] && [ -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
                echo "The debug APK build succeeded, and the Actions artifact \`app-debug-apk\` remains available as a backup."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
